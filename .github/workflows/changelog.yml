name: Changelog

# Release notes come from "## Unreleased" in CHANGELOG.md. A pull request
# into main that changes the app (APP_PATHS below) must add a line there,
# or say on a line of its own in its description
#   Changelog: none
# when users won't notice the change. The "Testing build" PR is skipped;
# each feature's own PR into main carries its line.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: ['main']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    if: github.head_ref != 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for a changelog line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          APP_PATHS: '^(app/src|combined-go|third_party)/|^kit$'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          repo, pr = os.environ['REPO'], os.environ['PR']
          def api(path):
              return json.loads(subprocess.run(['gh', 'api', path], check=True,
                                               capture_output=True, text=True).stdout)
          body = api('repos/%s/pulls/%s' % (repo, pr)).get('body') or ''
          files, page = [], 1
          while True:
              batch = api('repos/%s/pulls/%s/files?per_page=100&page=%d' % (repo, pr, page))
              files += batch
              if len(batch) < 100:
                  break
              page += 1
          app = [f['filename'] for f in files if re.match(os.environ['APP_PATHS'], f['filename'])]
          added = []
          for f in files:
              if f['filename'] == 'CHANGELOG.md':
                  added += [l[1:].strip() for l in (f.get('patch') or '').splitlines()
                            if l.startswith('+') and not l.startswith('+++') and l[1:].strip().startswith('-')]
          none = re.search(r'(?im)^\s*(?:[-*]\s*)?\**changelog\**:?\**\s*none\b', body)
          def finish(ok, title):
              print('::%s title=Changelog::%s' % ('notice' if ok else 'error', title))
              sys.exit(0 if ok else 1)
          if not app:
              finish(True, 'no app change')
          if added:
              finish(True, 'adds %d line(s) to CHANGELOG.md' % len(added))
          if none:
              finish(True, 'marked "Changelog: none"')
          finish(False, 'this PR changes the app but adds no line under "## Unreleased" in CHANGELOG.md. '
                        'Add one plain line users would understand, or put "Changelog: none" on a line of its own in the description.')
          PY
